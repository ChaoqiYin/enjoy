name: Release

# Tagging is the release action: the version lives in three files, so the tag
# is what states which one this build is.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # The workspace root holds no Cargo.toml, so the cache has to be pointed
      # at src-tauri; the default would cache a target directory that is never
      # written to, and every release would rebuild from scratch.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci --no-audit --no-fund

      # The same checks the verify workflow runs. Repeated here so a release
      # stops before building rather than publishing a manifest whose version
      # disagrees with the build.
      - run: npm run check

      - name: Check the tag matches the packaged version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match the packaged version $version"
          }

      # The media binaries are gitignored, and the release build asserts they
      # are present, so they are fetched here rather than committed. They hang
      # off a dedicated release tag so every build gets the same pair instead of
      # whatever the upstream latest happens to be that day.
      #
      # The hashes are the ones recorded in SOURCE.md next to the binaries.
      # Without them a replaced asset would be packed into a release unremarked.
      - name: Fetch the pinned media tools
        shell: pwsh
        env:
          FFMPEG_SHA256: e50359db4a15de57b5f744f330573b9c7364ed6b4f98a992b4fd5fb54c015b5c
          FFPROBE_SHA256: a8c1e6b5c130af6ed18e1963e5b5a602796f8b848155a82f728bf791ba99a58a
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $base = 'https://github.com/ChaoqiYin/enjoy/releases/download/ffmpeg-tools'
          $target = 'resources/ffmpeg/windows-x86_64'
          foreach ($pair in @(@('ffmpeg.exe', $env:FFMPEG_SHA256), @('ffprobe.exe', $env:FFPROBE_SHA256))) {
            $path = Join-Path $target $pair[0]
            Invoke-WebRequest -Uri "$base/$($pair[0])" -OutFile $path
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $pair[1]) {
              throw "$($pair[0]) checksum mismatch: expected $($pair[1]), got $hash"
            }
            Write-Host "$($pair[0]) verified: $hash"
          }

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Enjoy v__VERSION__'
          # A draft, deliberately. The updater endpoint resolves
          # releases/latest, which skips drafts, so the artifacts can be
          # installed and checked by hand before the endpoint starts offering
          # them. The cost is that the first release has to be installed by
          # hand; automatic updates begin with the release after it.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
