[package]
name="enjoy"
version="0.1.9"
edition="2021"
[dependencies]
tracing="0.1"
tracing-subscriber= {version="0.3",features= ["env-filter"] }
sys-locale="0.3"
tauri-plugin-store="2"
tauri-plugin-dialog="2"
tauri= {version="2",features= ["protocol-asset"] }
serde= {version="1",features= ["derive"] }
serde_json="1"
walkdir="2"
rusqlite= {version="0.31",features= ["bundled"] }
tauri-plugin-opener = "^2"
tauri-plugin-updater="2"
time= {version="0.3",features= ["formatting"] }
base64="0.22"
futures-util="0.3"
minisign-verify="0.2"
# `system-proxy` is declared rather than inherited. The download has to take the
# same route as the check, and the route is the operating system's setting
# (`hyper-util` reads the Windows registry `Internet Settings` on Windows,
# SystemConfiguration on macOS); without the feature a proxied machine downloads
# direct, which is a different path with a different speed and no error to say
# so. It arrives through `tauri-plugin-updater`'s default features today because
# both use this one reqwest build — a default elsewhere is not a dependency of
# ours. `default-tls`/`charset`/`http2` are deliberately left off: the updater
# picks the TLS backend, and a release payload is not text to decode.
reqwest= {version="0.13",default-features=false,features= ["stream","rustls-no-provider","system-proxy"] }
rustls= {version="0.23",default-features=false,features= ["ring"] }
# `macros` for the select that lets a stop interrupt a read, `sync` for the
# notification that makes it felt before the next byte rather than after it, and
# `time` for the retry waits.
tokio= {version="1",features= ["macros","sync","time"] }

[dev-dependencies]
# Only for the signature tests, which have to bring a key of their own: a valid
# minisign signature cannot be made without the private key that makes it, and
# the one that signs our releases is not in this repository.
ring="0.17"

[build-dependencies]
tauri-build= {version="2", features = [] }
