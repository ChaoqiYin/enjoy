[package]
name="enjoy"
version="0.4.0"
edition="2021"
[dependencies]
tracing="0.1"
tracing-subscriber= {version="0.3",features= ["env-filter"] }
sys-locale="0.3"
tauri-plugin-store="2"
tauri-plugin-dialog="2"
tauri= {version="2",features= ["protocol-asset"] }
serde= {version="1",features= ["derive"] }
serde_json="1"
walkdir="2"
rusqlite= {version="0.31",features= ["bundled"] }
tauri-plugin-opener = "^2"
tauri-plugin-updater="2"
time= {version="0.3",features= ["formatting"] }
base64="0.22"
futures-util="0.3"
minisign-verify="0.2"
# `system-proxy` is declared rather than inherited. The download has to take the
# same route as the check, and the route is the operating system's setting
# (`hyper-util` reads the Windows registry `Internet Settings` on Windows,
# SystemConfiguration on macOS); without the feature a proxied machine downloads
# direct, which is a different path with a different speed and no error to say
# so. It arrives through `tauri-plugin-updater`'s default features today because
# both use this one reqwest build — a default elsewhere is not a dependency of
# ours. `default-tls`/`charset`/`http2` are deliberately left off: the updater
# picks the TLS backend, and a release payload is not text to decode.
reqwest= {version="0.13",default-features=false,features= ["stream", "rustls-no-provider", "system-proxy"] }
rustls= {version="0.23",default-features=false,features= ["ring"] }
# `macros` for the select that lets a stop interrupt a read, `sync` for the
# notification that makes it felt before the next byte rather than after it, and
# `time` for the retry waits. The last three are the 共享服务's: `net` for the
# listener it accepts on, `rt-multi-thread` so that two devices pulling two
# videos are not queued behind each other, and `io-util` for the adapter that
# hands a tokio socket to hyper.
tokio= {version="1",features= ["macros", "sync", "time", "net", "rt-multi-thread", "io-util"] }
# The WebDAV server the 共享服务 is built on, and the HTTP server it runs on.
# hyper and hyper-util are already in the tree through the update client's own
# stack -- and `http`, which both of them speak -- so this adds no new version
# line, only makes them ours to name.
#
# `default-features` is off because the crate's defaults are its two
# filesystems, the local one and the in-memory one, and this application uses
# neither: the service serves from a virtual filesystem built out of the 共享清单
# rather than out of a directory (see `share::fs`). The one backend it does use
# -- the placeholder lock system that answers Finder's and Explorer's LOCK
# probes -- has no feature to turn off and always arrives.
dav-server= {version="0.11",default-features=false }
hyper= {version="1",features= ["http1", "server"] }
hyper-util= {version="0.1",features= ["tokio"] }
# The request and response types the two of them and the WebDAV handler all
# speak, and the buffer a file is read into. Declared for the same reason as
# hyper: already in the tree, now ours to name.
http="1"
bytes="1"
# The bytes the 共享服务's password is drawn from. The operating system is the
# only thing in this application that produces a number nobody can predict --
# the clock and the hash functions are things a reader of this source can work
# out -- and this is the one string where that matters. It arrives through
# `tauri`, so declaring it adds no new version line either.
getrandom="0.3"
# The machine's own addresses, for the page that tells the user what to type
# into the television. New here rather than already in the tree, and there is
# nothing to derive them from: the operating system is the only thing that knows
# which interfaces exist, and asking it means `GetAdaptersAddresses` on Windows
# and `getifaddrs` elsewhere -- the two platform branches this crate is, in a
# hundred lines, with the unsafe in its own code rather than ours.
if-addrs="0.15"
# The maximize button's hit test, which is the only thing in this application
# that speaks to the window manager itself. Windows 11 hangs its snap-layouts
# flyout on one answer and one answer only: `WM_NCHITTEST` returning
# `HTMAXBUTTON` for the point under the pointer. That point is inside a rectangle
# this interface owns — the button is drawn in the webview — so the answer has to
# come from outside the page, and this plugin is what produces it: it lays a
# transparent child window over the button and subclasses that child, rather than
# subclassing the window itself.
#
# Taken rather than written, and the comparison is in ADR 0041. What decided it
# is the child: the main window's message chain — the drag region, the resize
# borders, everything `tao` does with it — is left exactly as it was, and the
# plugin's own dependencies (`raw-window-handle`, `thiserror`, `windows-version`,
# `windows-sys`) are all already in the tree through `tao`, so this adds no new
# version line. Nowhere but Windows 11 (build 22000) does it do anything: below
# that, and on macOS, every call of it is a no-op.
tauri-plugin-snap-layout="1"
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# The runtime a plugin's working half runs in (ADR 0044). Pinned to a major
# because this is the one dependency here whose API moves under it between
# releases; `Cargo.lock` holds the exact 47.0.4.
#
# `default-features` is off and the list is written out, because the defaults
# are the whole of wasmtime: the component model, garbage collection, a pooling
# allocator, profiling, threads, a stack-switching engine. What this application
# does is instantiate one small module per plugin and call one exported function
# on it, so what it needs is three things:
#
# - `cranelift`, the compiler. Without a compiler there is nothing to run.
# - `runtime`, which is `Engine`, `Store`, `Linker` and `Func` themselves.
# - `async`, the host functions and `Func::call_async` they are called through
#   (ADR 0044 §5). Async is a one-way door — a store that has any async host
#   function is an async store throughout — and it is what makes a plugin that
#   is waiting on the network a wait that can be cut off.
# - `std`, because this is a program and not a `no_std` one.
#
# `wat` is deliberately not here: nothing in the application ever loads a module
# as text. The tests do, and they take it as a dev-dependency of their own, so
# the shipped binary carries no WAT parser.
wasmtime= {version="47",default-features=false,features= ["cranelift", "runtime", "async", "std"] }

[dev-dependencies]
# Only for the signature tests, which have to bring a key of their own: a valid
# minisign signature cannot be made without the private key that makes it, and
# the one that signs our releases is not in this repository.
ring="0.17"
# Only for the plugin runtime's tests, which write their wasm modules as text
# rather than committing a `.wasm` beside them: `wasm32` is not a target this
# repository builds for, and a fixture that has to be compiled by another
# toolchain before the test can run is a fixture that stops being run. Declared
# apart from `wasmtime`'s own `wat` feature so that the parser stays out of the
# binary — see the note on `wasmtime` above.
wat="1"

[build-dependencies]
tauri-build= {version="2", features = [] }
